<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intizom Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root,:root[data-theme=tun]{--bg:#0a0e14;--c:#121820;--t:#e8edf5;--m:#8b9bb0;--a:#b8f25a;--b:#1e2836;--r:#f04348;--o:#fbbf24;--pb:#f59e0b;--planb:#fef3c7;--card:rgba(18,24,32,.88);--hdr:rgba(8,12,18,.75);--nav:rgba(8,12,18,.82);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=qogoz]{--bg:#f7f3eb;--c:#ffffff;--t:#1c1814;--m:#5c534a;--a:#c45c26;--b:#e8dfd0;--r:#c43c3c;--o:#d97706;--pb:#c45c26;--planb:#fde8d0;--card:rgba(255,255,255,.96);--hdr:rgba(247,243,235,.92);--nav:rgba(247,243,235,.96);color-scheme:light;--shadow:rgba(28,24,20,.06)}
:root[data-theme=qogoz] body{background-image:radial-gradient(ellipse 120% 80% at 50% -20%,rgba(196,92,38,.07),transparent 55%),radial-gradient(ellipse 70% 50% at 100% 100%,rgba(196,92,38,.04),transparent 45%)}
:root[data-theme=qogoz] .card{box-shadow:0 1px 3px rgba(28,24,20,.04),0 6px 20px rgba(28,24,20,.05)}
:root[data-theme=qogoz] .more-tile{background:rgba(255,255,255,.88);box-shadow:0 1px 6px rgba(28,24,20,.06)}
:root[data-theme=qogoz] nav{background:rgba(247,243,235,.82);box-shadow:0 4px 24px rgba(28,24,20,.1),0 1px 0 rgba(255,255,255,.5) inset}
:root[data-theme=qogoz] input,:root[data-theme=qogoz] select,:root[data-theme=qogoz] textarea{background:#faf7f2}

:root[data-theme=qogoz] 
:root[data-theme=qogoz] .card{box-shadow:0 1px 3px rgba(28,24,20,.04),0 4px 16px rgba(28,24,20,.05);border-color:color-mix(in srgb,var(--b) 90%,transparent)}
:root[data-theme=qogoz] .more-tile{background:rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(28,24,20,.05)}
:root[data-theme=qogoz] .more-tile:hover,.more-tile:focus{background:rgba(255,255,255,.95);box-shadow:0 2px 12px rgba(196,92,38,.12)}
:root[data-theme=qogoz] input,:root[data-theme=qogoz] select,:root[data-theme=qogoz] textarea{background:#faf7f2}
:root[data-theme=qogoz] nav{box-shadow:0 -1px 12px rgba(28,24,20,.04)}

:root[data-theme=mono]{--bg:#0a0a0c;--c:#141418;--t:#f0f0f5;--m:#8a8a9a;--a:#3b82f6;--b:#22222c;--r:#ef4444;--o:#60a5fa;--pb:#3b82f6;--planb:#1e3a5f;--card:rgba(20,20,24,.9);--hdr:rgba(8,8,10,.8);--nav:rgba(8,8,10,.85);color-scheme:dark}


*{box-sizing:border-box}html,body{margin:0}
html{background:var(--bg);transition:background .25s}
body{background:transparent;color:var(--t);font:15px/1.45 "Manrope",system-ui,-apple-system,sans-serif;padding-bottom:92px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
:root[data-theme=tun] body,:root:not([data-theme]) body{background-color:var(--bg);background-image:
  radial-gradient(ellipse 110% 70% at 50% -15%,rgba(184,242,90,.11),transparent 52%),
  radial-gradient(ellipse 70% 55% at 100% 20%,rgba(56,140,220,.08),transparent 50%),
  radial-gradient(ellipse 60% 50% at 0% 80%,rgba(100,180,255,.06),transparent 48%),
  radial-gradient(ellipse 80% 40% at 80% 100%,rgba(184,242,90,.05),transparent 45%);
  background-attachment:fixed}
:root[data-theme=mono] body{background-color:var(--bg);background-image:
  radial-gradient(ellipse 100% 60% at 50% -12%,rgba(59,130,246,.12),transparent 52%),
  radial-gradient(ellipse 70% 50% at 100% 90%,rgba(96,165,250,.08),transparent 48%),
  radial-gradient(ellipse 55% 45% at 0% 40%,rgba(99,102,241,.06),transparent 45%);
  background-attachment:fixed}
:root[data-theme=qogoz] body{background-attachment:fixed}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--hdr) 70%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);padding:12px 16px;border-bottom:1px solid color-mix(in srgb,var(--b) 45%,transparent)}
.hp{display:flex;align-items:center;gap:10px}
#heart{font-size:28px;transition:transform .2s}#heart.hit{animation:sh .6s}
@keyframes sh{20%{transform:scale(1.4) rotate(-12deg)}40%{transform:scale(.8) rotate(10deg)}60%{transform:scale(1.3) rotate(-8deg)}}
.bar{flex:1;height:10px;background:var(--b);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--r),#fb7185);border-radius:99px;transition:width .5s ease}
.sm{color:var(--m);font-size:12.5px}
main{position:relative;z-index:1;padding:14px 16px 28px;max-width:640px;margin:auto}
.card{background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2);border:1px solid color-mix(in srgb,var(--b) 70%,transparent);border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.08),0 12px 36px rgba(0,0,0,.06);transition:border-color .2s ease,box-shadow .2s ease,transform .15s ease}
.card:active{transform:scale(0.992)}
.miss{border-color:color-mix(in srgb,var(--r) 45%,transparent)!important;background:color-mix(in srgb,var(--r) 8%,var(--card))!important}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1;min-width:0}
h2{font-size:18px;margin:18px 0 10px;font-weight:700;letter-spacing:-.02em}h3{font-size:13px;margin:14px 0 8px;color:var(--m);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:12px;padding:11px 13px;min-width:0;width:100%;transition:border-color .15s,box-shadow .15s;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 22%,transparent)}
button{font:inherit;cursor:pointer;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:12px;padding:10px 14px;transition:background .15s,transform .12s,border-color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:scale(0.97);opacity:.92}button:active{transform:scale(.97)}
button.p{background:var(--a);border-color:var(--a);color:#0a0a0a;font-weight:700}:root[data-theme=mono] button.p{color:#fff}:root[data-theme=qogoz] button.p{color:#fff}button.d{background:var(--r);border-color:var(--r);color:#fff}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--a);padding:0;flex:none;background:none}.chk.on{background:var(--a)}
.tag{font-size:11.5px;border-radius:7px;padding:2px 7px;border:1px solid var(--b);color:var(--m)}
.p1{border-left:5px solid var(--r)}.p2{border-left:5px solid var(--o)}.p3{border-left:5px solid #3b82f6}.p4{border-left:5px solid var(--b)}
.done .sp{text-decoration:line-through;opacity:.5}.miss{background:color-mix(in srgb,var(--r) 12%,var(--c))}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;background:color-mix(in srgb,var(--nav) 72%,transparent);-webkit-backdrop-filter:blur(28px) saturate(1.5);backdrop-filter:blur(28px) saturate(1.5);border:1px solid color-mix(in srgb,var(--b) 50%,transparent);border-radius:24px;padding:5px;box-shadow:0 6px 32px rgba(0,0,0,.22),0 1px 0 rgba(255,255,255,.07) inset;overflow:hidden}
nav button{flex:1;border:0;border-radius:16px;background:none;padding:8px 0 6px;font-size:10.5px;font-weight:500;color:var(--m);letter-spacing:.01em;transition:color .15s,background .15s}nav button b{display:block;font-size:20px;font-weight:400;margin-bottom:1px;transition:transform .15s}nav button.on{color:var(--a);font-weight:700;background:color-mix(in srgb,var(--a) 16%,transparent)}nav button.on b{transform:scale(1.1)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:64px;font-weight:800;text-align:center;letter-spacing:2px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-bottom:12px;padding:4px;background:color-mix(in srgb,var(--b) 55%,transparent);border-radius:14px}.tabs button{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--m)}.tabs .on{background:var(--a);color:#0a0a0a;border:0;box-shadow:0 2px 8px color-mix(in srgb,var(--a) 40%,transparent)}:root[data-theme=mono] .tabs .on{color:#fff}:root[data-theme=qogoz] .tabs .on{color:#fff}
#study{position:fixed;inset:0;background:rgba(5,8,15,.6);color:#fff;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
#study .big{font-size:84px}#study input{max-width:420px;background:#101828;color:#fff}
.hr{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--b);padding:6px 0}.hr>b{width:44px;color:var(--m);font-weight:600;padding-top:9px}
#toast{position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:color-mix(in srgb,var(--t) 94%,transparent);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:40;display:none;max-width:min(88%,360px);font-weight:600;font-size:13.5px;box-shadow:0 10px 40px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);opacity:0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:none;text-align:center;line-height:1.35;transition:opacity .22s ease,transform .22s ease}
.tas{font-size:44px;width:150px;height:150px;border-radius:50%;margin:10px auto;display:block;background:var(--a);color:#0a0a0a;border:0;font-weight:800}
video,audio{width:100%;margin-top:6px;border-radius:10px}
#fl,#win{position:fixed;inset:0;display:none;z-index:25;background:radial-gradient(circle at 50% 40%,rgba(16,35,58,.9),rgba(5,8,15,.96));color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#win{z-index:26;background:radial-gradient(circle at 50% 45%,#0f3d3a,#05080f)}
#fls{display:flex;flex-direction:column;gap:10px}
#fls{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(92vw,400px)}
.swr{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 10px 12px;border:1px solid #22304a;border-radius:18px;background:linear-gradient(#0e1a2e,#09111f);text-align:center;font-size:13px;line-height:1.25;transition:border-color .5s,box-shadow .5s}
.swr.on{border-color:#14b8a6;box-shadow:0 0 24px rgba(62,240,168,.28)}
.led{position:absolute;top:10px;right:10px;width:12px;height:12px;border-radius:50%;background:#2b3550;transition:.6s}.swr.on .led{background:#3ef0a8;box-shadow:0 0 14px #3ef0a8}
.trk{--p:0;position:relative;width:64px;height:170px;border-radius:32px;background:linear-gradient(90deg,#05080f,#111c30 50%,#05080f);box-shadow:inset 0 3px 10px #000,0 1px 0 #2a3a58;touch-action:none}
.trk:before{content:'';position:absolute;left:50%;top:26px;bottom:26px;width:8px;margin-left:-4px;border-radius:4px;background:#000;box-shadow:inset 0 0 4px #000,0 0 0 1px #1c2a44}
.trk:after{content:'▲';position:absolute;left:0;right:0;top:7px;text-align:center;font-size:11px;color:#3ef0a8;animation:ar 1.3s ease-in-out infinite}
.swr.on .trk:after{display:none}@keyframes ar{0%,100%{opacity:.2;transform:translateY(3px)}50%{opacity:1;transform:translateY(-2px)}}
.fill{position:absolute;left:50%;bottom:4px;width:8px;margin-left:-4px;border-radius:4px;background:linear-gradient(#3ef0a8,#14b8a6);height:calc(24px + var(--p)*(100% - 56px));opacity:.9}
.kn{position:absolute;left:50%;margin-left:-24px;width:48px;height:48px;border-radius:50%;bottom:calc(4px + var(--p)*(100% - 56px));background:radial-gradient(circle at 35% 30%,#9aa8c0,#3a4660 55%,#1a2234);box-shadow:0 7px 12px rgba(0,0,0,.65),inset 0 -3px 6px rgba(0,0,0,.45);display:grid;place-items:center;color:#d6e4f5;font:800 17px ui-monospace,monospace;cursor:grab;touch-action:none;outline:none;user-select:none;-webkit-user-select:none}
.kn:after{content:'N'}.trk.drag .kn{cursor:grabbing}
.trk:not(.drag) .kn,.trk:not(.drag) .fill{transition:bottom .35s cubic-bezier(.3,1.35,.5,1),height .35s cubic-bezier(.3,1.35,.5,1)}
.swr.on .kn{background:radial-gradient(circle at 35% 30%,#a6f9d8,#14b8a6 55%,#0a5a50);color:#04231f;cursor:default}.swr.on .kn:after{content:'D'}
.kn:focus-visible{box-shadow:0 0 0 3px #3ef0a8}
#cosmos{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.neb{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(40% 35% at 20% 25%,rgba(88,64,214,.32),transparent 70%),radial-gradient(35% 30% at 80% 72%,rgba(20,184,166,.24),transparent 70%),radial-gradient(30% 30% at 62% 14%,rgba(206,62,166,.17),transparent 70%);animation:nd 38s ease-in-out infinite alternate}
@keyframes nd{to{transform:translate(4%,3%) rotate(6deg) scale(1.1)}}
@media(prefers-reduced-motion:reduce){.neb,.trk:after{animation:none}}
#wp{position:absolute;left:50%;top:42%;pointer-events:none}
#wp span{position:absolute;font-size:22px;opacity:0;animation:bu 1.6s ease-out forwards}
@keyframes bu{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 80px)) scale(1.2) rotate(240deg);opacity:0}}
.gl{font-size:80px;animation:gl 1.6s ease-in-out infinite}@keyframes gl{50%{transform:scale(1.15);filter:drop-shadow(0 0 24px #3ef0a8)}}
#qm{position:fixed;inset:0;display:none;z-index:24;background:rgba(0,0,0,.72);align-items:center;justify-content:center}

#he,#te{position:fixed;inset:0;z-index:22;background:var(--bg);overflow:auto;display:none}
.hhd{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;color:var(--t);background:var(--c);border-bottom:1px solid var(--b)}
.hhd input,.hhd textarea{background:transparent;color:var(--t);border-color:transparent}
.hhd input::placeholder,.hhd textarea::placeholder{color:var(--m)}
.hbd{padding:8px 16px calc(28px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}
.hhd label,.hbd label{display:block;font-weight:600;font-size:12px;margin:14px 0 6px;color:var(--m)}
.lk{border:0;background:none;color:var(--a);padding:4px 0;font-size:13px}
.cli{display:flex;gap:8px;align-items:center;margin-top:5px}.cli input{width:auto}.cli.done span{text-decoration:line-through;opacity:.5}
.coin{color:#fbbf24;font-size:12.5px;margin-top:1px}
button:disabled{opacity:.35;cursor:default}
#intro{position:fixed;inset:0;z-index:50;background:#020810;overflow:hidden;cursor:pointer;opacity:1;perspective:1200px;perspective-origin:50% 42%}
.intro-sea{position:absolute;inset:0;z-index:0;background:
  radial-gradient(ellipse 95% 70% at 50% 42%,rgba(18,70,120,.45),transparent 58%),
  radial-gradient(ellipse 100% 80% at 50% 100%,rgba(0,6,18,.98),transparent 48%),
  radial-gradient(circle at 50% 35%,rgba(40,110,170,.2),transparent 42%),
  linear-gradient(180deg,#01060e 0%,#061428 42%,#0a1c34 72%,#01050c 100%)}
.intro-caustics{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.4;mix-blend-mode:screen;
  background:
    radial-gradient(ellipse 42% 22% at 28% 38%,rgba(90,190,255,.18),transparent 55%),
    radial-gradient(ellipse 38% 20% at 72% 52%,rgba(60,160,240,.14),transparent 55%),
    radial-gradient(ellipse 50% 28% at 50% 28%,rgba(120,210,255,.1),transparent 60%);
  animation:caustMove 5s ease-in-out infinite alternate}
@keyframes caustMove{from{transform:translateY(0) scale(1);opacity:.32}to{transform:translateY(14px) scale(1.06);opacity:.48}}
.intro-bubbles{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.intro-bubbles i{position:absolute;bottom:-16px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(210,235,255,.75),rgba(100,180,255,.12));
  animation:bubUp linear infinite}
@keyframes bubUp{0%{transform:translateY(0) scale(1);opacity:0}12%{opacity:.65}90%{opacity:.3}100%{transform:translateY(-110vh) scale(.45);opacity:0}}
.intro-shark-wrap{position:absolute;left:50%;top:48%;z-index:3;width:min(96vw,680px);height:min(72vw,500px);
  transform:translate(-50%,-50%);transform-style:preserve-3d;pointer-events:none}
.intro-shark{width:100%;height:100%;object-fit:contain;transform-origin:center 55%;will-change:transform,filter,opacity;
  opacity:0;filter:drop-shadow(0 28px 56px rgba(0,15,40,.9)) contrast(1.22) saturate(1.35) brightness(1.06);
  -webkit-mask-image:radial-gradient(ellipse 82% 78% at 50% 50%,#000 50%,rgba(0,0,0,.85) 70%,transparent 90%);
  mask-image:radial-gradient(ellipse 82% 78% at 50% 50%,#000 50%,rgba(0,0,0,.85) 70%,transparent 90%);
  animation:sharkAtk 2.9s cubic-bezier(.08,.42,.14,1) forwards}
@keyframes sharkAtk{
0%{transform:translate3d(0,0,-360px) scale(.03) rotateZ(-3.5deg) rotateY(20deg) rotateX(5deg);filter:drop-shadow(0 8px 18px rgba(0,12,30,.5)) contrast(1.05) saturate(1.05) brightness(.78) blur(1.3px);opacity:0}
5%{opacity:1}
10%{transform:translate3d(-3%,1%,-300px) scale(.05) rotateZ(2.8deg) rotateY(-15deg) rotateX(4deg)}
20%{transform:translate3d(3.5%,-1.5%,-230px) scale(.1) rotateZ(-3deg) rotateY(12deg) rotateX(3deg)}
32%{transform:translate3d(-3.5%,1%,-150px) scale(.2) rotateZ(2.5deg) rotateY(-9deg) rotateX(1.5deg);filter:drop-shadow(0 16px 36px rgba(0,22,48,.6)) contrast(1.12) saturate(1.18) brightness(.9) blur(.65px)}
45%{transform:translate3d(2.8%,-.8%,-50px) scale(.4) rotateZ(-2deg) rotateY(7deg) rotateX(0deg)}
58%{transform:translate3d(-2%,.5%,50px) scale(.75) rotateZ(1.8deg) rotateY(-5deg) rotateX(-1deg);filter:drop-shadow(0 24px 50px rgba(0,28,55,.68)) contrast(1.16) saturate(1.25) brightness(1.0) blur(.3px)}
70%{transform:translate3d(1.5%,-.3%,140px) scale(1.4) rotateZ(-1.2deg) rotateY(3deg) rotateX(-2.5deg)}
82%{transform:translate3d(-.8%,.15%,250px) scale(2.6) rotateZ(.6deg) rotateY(-1.5deg) rotateX(-4deg);filter:drop-shadow(0 32px 64px rgba(0,34,68,.5)) contrast(1.14) saturate(1.18) brightness(1.08) blur(.2px)}
92%{transform:translate3d(.2%,0,360px) scale(4.2) rotateZ(-.2deg) rotateY(.3deg) rotateX(-5deg);opacity:1}
100%{transform:translate3d(0,0,520px) scale(6.5) rotateZ(0) rotateY(0) rotateX(-6deg);filter:drop-shadow(0 44px 90px rgba(0,28,55,.28)) contrast(1.1) saturate(1.1) brightness(1.14) blur(0);opacity:0}
}
.intro-vignette{position:absolute;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(ellipse 68% 55% at 50% 44%,transparent 8%,rgba(0,0,0,.4) 62%,rgba(0,0,0,.9) 100%);
  animation:vigIn 1s ease-out forwards}
@keyframes vigIn{from{opacity:.35}to{opacity:1}}
#skip{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px)+12px);z-index:6;
  background:rgba(0,0,0,.4);border:1px solid rgba(120,160,200,.35);color:rgba(210,225,245,.9);
  font-size:12px;padding:7px 14px;border-radius:11px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.fab{position:fixed;right:18px;bottom:calc(100px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--a);color:#0a0a0a;font-size:28px;font-weight:700;z-index:7;box-shadow:0 6px 24px color-mix(in srgb,var(--a) 45%,rgba(0,0,0,.4));padding:0;display:grid;place-items:center;transition:transform .15s,box-shadow .15s;transition:transform .15s ease,box-shadow .15s ease}
.fab:active{transform:scale(0.92)}.fab:active{transform:scale(.92)}:root[data-theme=mono] :root[data-theme=mono] :root[data-theme=qogoz] 




/* Mini Pomodoro — compact floating pill */

    const title=MD[tm]?MD[tm][0]:'Timer';

let _planDrag=null;
function planDragStart(e,tid){
  if(e.button!=null&&e.button!==0)return;
  const t=S.tasks.find(x=>x.id==tid);if(!t||t.allday)return;
  window._planDragged=false;
  const el=e.currentTarget;
  el.setPointerCapture(e.pointerId);
  const st0=t.st!=null?t.st:(t.hour||9)*60;
  const en0=t.en!=null?t.en:st0+60;
  const dur=Math.max(15,en0-st0);
  _planDrag={tid,el,startY:e.clientY,st0,dur,lastSt:st0};
  el.onpointermove=planDragMove;
  el.onpointerup=planDragEnd;
  el.onpointercancel=planDragEnd;
  e.preventDefault();e.stopPropagation();
}
function planDragMove(e){
  if(!_planDrag)return;
  const dy=e.clientY-_planDrag.startY;
  if(Math.abs(dy)>6)window._planDragged=true;
  const dMin=Math.round(dy/48*60/15)*15; // 15-min steps
  let newSt=Math.max(5*60,Math.min(23*60,_planDrag.st0+dMin));
  let newEn=Math.min(24*60,newSt+_planDrag.dur);
  if(newEn-newSt<_planDrag.dur)newSt=Math.max(5*60,newEn-_planDrag.dur);
  _planDrag.lastSt=newSt;
  const top=((newSt/60)-5)*48;
  const hgt=Math.max(24,(_planDrag.dur/60)*48-4);
  _planDrag.el.style.top=top+'px';
  _planDrag.el.style.height=hgt+'px';
  const tm=_planDrag.el.querySelector('.tm');
  if(tm)tm.textContent=tm2(newSt)+'–'+tm2(newEn);
}
function planDragEnd(e){
  if(!_planDrag)return;
  const {tid,el,lastSt,dur}=_planDrag;
  el.onpointermove=el.onpointerup=el.onpointercancel=null;

  const t=S.tasks.find(x=>x.id==tid);
  if(t&&window._planDragged){

function vPlanMonth(){
  const base=pd(cd);
  const y=base.getFullYear(), m=base.getMonth();
  const first=new Date(y,m,1);
  const startDow=(first.getDay()+6)%7; // Mon=0
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=ds();
  const monthName=first.toLocaleDateString('en',{month:'long',year:'numeric'});
  const weekDays=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let cells='';
  // prev month fillers
  const prevDays=new Date(y,m,0).getDate();
  for(let i=0;i<startDow;i++){
    const d=prevDays-startDow+i+1;
    const dsPrev=ds(new Date(y,m-1,d));
    cells+=monthCell(dsPrev,d,true,today);
  }
  for(let d=1;d<=daysInMonth;d++){
    const dsCur=ds(new Date(y,m,d));
    cells+=monthCell(dsCur,d,false,today);
  }
  // next month fillers to complete weeks (42 cells max)
  const total=startDow+daysInMonth;
  const remain=(7-total%7)%7;
  for(let d=1;d<=remain;d++){
    const dsNext=ds(new Date(y,m+1,d));
    cells+=monthCell(dsNext,d,true,today);
  }
  const nav=`<div class="row" style="margin-bottom:10px">
    <button onclick="cd=ds(new Date(y,m-1,1));draw()">◀</button>
    <b class="sp" style="text-align:center">${monthName}</b>
    <button onclick="cd=ds();planView='day';draw()">Bugun</button>
    <button onclick="cd=ds(new Date(y,m+1,1));draw()">▶</button>
  </div>`;
  const head=weekDays.map(w=>`<div class="mon-head">${w}</div>`).join('');
  return nav+`<div class="mon-grid"><div class="mon-heads">${head}</div><div class="mon-body">${cells}</div></div>`;
}

function monthCell(dateStr, dayNum, muted, today){
  const tasks=S.tasks.filter(t=>t.date==dateStr);

    const cls=t.planB?'chip-b':(t.done?'chip-done':(t.type==='event'?'chip-e':'chip-t'));
    return `<div class="mon-chip ${cls}" onclick="event.stopPropagation();openT('${t.id}')">${E((t.t||'').slice(0,14))}</div>`;
  }).join('');
  if(tasks.length>maxShow) chips+=`<div class="mon-more">+${tasks.length-maxShow}</div>`;
  return `<div class="mon-cell${muted?' muted':''}${isToday?' today':''}" onclick="cd='${dateStr}';planView='day';draw()">
    <div class="mon-daynum${isToday?' on':''}">${dayNum}</div>
    <div class="mon-chips">${chips}</div>
  </div>`;
}

function applyPlanB(){
  const reason=($('pbReason').value||'').trim();
  S.lastPlanBReason=reason;
  S.planBLog=S.planBLog||[];
  S.planBLog.unshift({d:ds(),r:reason,ts:Date.now()});
  if(S.planBLog.length>20)S.planBLog.length=20;
  const boxes=[...document.querySelectorAll('#pbList input[type=checkbox]')];
  const selected=boxes.filter(b=>b.checked);
  const T=ds();
  let count=0;
  selected.forEach(b=>{
    const id=b.dataset.id;
    if(b.dataset.new){
      const st=+b.dataset.st, en=+b.dataset.en;
      S.tasks.push({id:uid(),t:b.dataset.title,date:T,hour:Math.floor(st/60),st,en,done:0,miss:0,pri:2,planB:1,type:'task'});
      count++;
    } else {
      const t=S.tasks.find(x=>x.id==id);
      if(!t)return;
      const stEl=$('pst_'+id), enEl=$('pen_'+id);
      let st=t.st!=null?t.st:(t.hour||9)*60, en=t.en!=null?t.en:st+60;
      if(stEl&&stEl.value){const [h,m]=stEl.value.split(':').map(Number);st=h*60+m}
      if(enEl&&enEl.value){const [h,m]=enEl.value.split(':').map(Number);en=h*60+m}
      t.st=st;t.en=en;t.hour=Math.floor(st/60);t.planB=1;t.miss=0;t.date=T;
      count++;
    }
  });
  // Unselected unfinished → push to later / next day lightly
  boxes.filter(b=>!b.checked&&!b.dataset.new).forEach(b=>{
    const t=S.tasks.find(x=>x.id==b.dataset.id);
    if(t&&!t.done){t.hour=Math.min(22,(t.hour||12)+2);t.st=null;t.en=null;}
  });
  save();
  $('pbModal')&&$('pbModal').remove();
  toast('Plan B tayyor: '+count+' ta vazifa · sabab saqlandi');
  if(reason)toast('Sabab: '+reason.slice(0,40)+(reason.length>40?'…':''));
  draw();
}

/* soul hit + penalties (vocab penalty adds 50 words to the vocab target) */
function hit(n,meta){meta=meta||{};
const day=meta.day||ds(),src=meta.src||'',sid=meta.sid||'';
/* one pending penalty per source item per day (Plan B may pass force:2) */
const already=(S.pen||[]).filter(p=>!p.d&&p.src===src&&p.sid===sid&&p.day===day).length;
const need=meta.force||1;
if(already>=need)return;
const add=need-already;
/* Soul only when: next-day check-in (fromCI) or explicit miss (forceSoul). Same-day auto-penalty = task only. */
const doSoul=!!(meta.fromCI||meta.forceSoul);
/* Soul amount by difficulty: easy/trivial=2, medium/hard=3 (or explicit meta.soul / meta.diff) */
let soulAmt=3;
if(meta.soul!=null) soulAmt=Math.max(1,Math.min(5,+meta.soul));
else if(meta.diff!=null) soulAmt=(+meta.diff)>=3?3:2;
else if(src==='habit'&&sid){const hh=S.habits.find(x=>x.id==sid);if(hh) soulAmt=(hh.diff||2)>=3?3:2;}
else if(src==='task'&&sid){const tt=S.tasks.find(x=>x.id==sid);if(tt&&tt.pri!=null) soulAmt=(tt.pri<=2)?3:2;} /* lower pri number = higher priority = harder? */
for(let i=0;i<add;i++){
  if(doSoul){S.hp=Math.max(0,S.hp-soulAmt)}
  const t=PEN[Math.floor(Math.random()*PEN.length)],v=/vocab/i.test(t);
  S.pen.push({id:uid(),t,f:n,d:0,v:v?1:0,src,sid,day,at:Date.now(),soul:soulAmt,soulHit:doSoul?1:0});
  if(v)S.vx=(S.vx||0)+50;
}
if(doSoul){const h=$('heart');if(h){h.classList.remove('hit');void h.offsetWidth;h.classList.add('hit')}}
if(doSoul&&S.hp==0){S.hp=25;S.pts=Math.max(0,S.pts-50);toast('Out of soul! −50 points, soul restored to 25')}
}

function vMake(){
  const raw=$('vt').value.split(/\n/);
  const pending=[]; let bad=0;
  raw.forEach(l=>{
    l=l.trim().replace(/^\d+[.)]\s+/,'');
    if(!l)return;
    const m=l.match(/\t| [-–—] |\s*[=|]\s*/)||l.match(/\s*:\s*/);
    if(m){
      const a=l.slice(0,m.index).trim(), b=l.slice(m.index+m[0].length).trim();
      if(a&&b) pending.push([a,b,0]); else bad++;
    } else if(/^[a-zA-Z][a-zA-Z\s\-']{0,40}$/.test(l)){
      pending.push([l,null,0]);
    } else bad++;
  });
  if(!pending.length) return toast('Yozing: word - tarjima  yoki  faqat inglizcha so‘z');
  const n = $('vn').value.trim() || prompt('To‘plam nomi:') || ('Set ' + ((S.vd||[]).length+1));
  const needDict = pending.filter(x=>x[1]==null);
  if(!needDict.length){
    (S.vd=S.vd||[]).push({id:uid(),n,c:$('vcat').value,w:pending});
    save(); toast(pending.length+' cards yaratildi'+(bad?' · '+bad+' o‘tkazib yuborildi':'')); draw(); return;
  }
  toast(needDict.length+' so‘z yuklanmoqda…');
  (async()=>{
    const w=[];
    for(const item of pending){
      if(item[1]!=null){ w.push(item); continue; }
      const word=item[0];
      try{
        const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word));
        if(!r.ok) throw 0;
        const j=await r.json();
        const e=j[0]||{};
        const phon = e.phonetic || (e.phonetics||[]).find(p=>p.text)?.text || '';
        const defs=[];
        (e.meanings||[]).forEach(m=>{
          (m.definitions||[]).slice(0,2).forEach(d=>{ if(d.definition) defs.push(d.definition); });
        });
        const tr = defs.slice(0,2).join(' · ') || '—';
        const full = phon ? (phon + ' · ' + tr) : tr;
        w.push([word, full, 0]);
      }catch(e){
        w.push([word, '(topilmadi — tahrirlang)', 0]);
      }
    }
    (S.vd=S.vd||[]).push({id:uid(),n,c:$('vcat').value,w});
    save();
    toast(w.length+' cards yaratildi (dict yordamida)');
    draw();
  })();
}
